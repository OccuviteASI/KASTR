; KASTR (Kenton's ASI Streaming Tool with Relay) -- optional config.
; Keep this file next to the KASTR binary. Delete it to use the built-in
; defaults. Command-line flags override anything set here.

[streamer]

; Relay the pages point at. This is the one setting most likely to change.
relay = http://10.10.105.190:4443

; Page to open on launch. The default is the tabbed shell (Go Live + Relay
; Server, with the connection lights), which keeps every tab you have opened
; running in the background. Use /moq-watch-lite.html to boot straight into
; Go Live alone.
page = /app.html

; Local port for the embedded web server. If it's taken, the app quietly
; picks a free one instead.
port = 8000

; Interface to bind. 127.0.0.1 keeps the UI on this machine only.
; Use 0.0.0.0 to let other machines on the network open it.
host = 127.0.0.1

; Cross-Origin-Embedder-Policy: require-corp (default) or credentialless.
; Switch to credentialless if the libav.js worker fails to load from
; cdn.jsdelivr.net -- SharedArrayBuffer still works either way.
coep = require-corp

; Start the bundled relay when KASTR launches. The Relay page's checkbox is
; the usual way to set this (it also remembers port/LAN/room-code choices);
; this key is the hand-edited fallback and starts a default relay.
; relay_autostart = true

; 0.9.0 / 0.21.40: the browser the app window runs in. `auto` (default) opens it in
; this computer's default browser when that is Chromium-based, else in the Chrome for
; Testing build shipped in the browser/ folder next to KASTR (relay/hub boxes, publisher
; and viewer boxes, and boxes hosting camera feeds always use that build); `bundled`
; always uses that build; `system` uses the machine's Chrome/Edge/Chromium; a full
; path names a specific browser.
; browser = auto

; Relay-only machine (0.8.2): boot straight to the Relay page (no Go Live
; nav), with the relay autostarted. Same binary -- fleet auto-update still
; applies. Equivalent to launching with --relay-only.
; mode = relay

; 0.21.10: on-demand camera pairs (standby until a viewer asks) and the 640-wide low copies
; (`-low.hang` thumbnails / click-to-picture) are OFF: every camera publishes its full pair
; always. `on` brings both back -- but the demand travels camera box -> relay host -> viewer
; page, so set it to `on` on EVERY KASTR of the fleet (camera boxes, the relay host and each
; viewer box; web clients follow the host that serves them), then relaunch. KASTR_ONDEMAND=1
; in the environment is the same switch (read once at launch).
; ondemand = off

; KASTR needs a Chromium browser (Chrome, Chromium, Edge, Brave). It is located
; automatically (see `browser` above). Firefox and Safari are not usable:
; the app window relies on --app/--user-data-dir, and the WebCodecs and
; WebTransport features the pages need are only complete in Chromium.
