<script type="module">
  import "https://esm.sh/@moq/watch/element";
  import { connect, producer, subscribe, withJwt } from "/assets/rcx-lib.js";

  const $ = (id) => document.getElementById(id);
  const KEEP_MS = 600, KEEP_N = 64, CLIP_MAX = 65536, QUIET_MS = 10000;
  let S = null, conn = null, prod = null;
  const c = { seq: 0, buf: [], sentAt: 0, mv: null, mvT: 0, mvAt: 0, wv: 0, wh: 0, down: new Set(), btn: new Set(), hold: null, escT: 0,
              sent: new Map(), ackS: 0, lat: null, clipN: 0, clipLast: null, clipPend: null, st: null, stAt: 0, ended: "", live: false,

  let toastT = 0;

  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin || !e.data || S) return;

  setTimeout(() => { if (!S) { clearInterval(readyT); msg("This window opens from <b>Machines…</b> in KASTR (or the hub's Relay page).<span class='sub'>Nothing to show here on its own.</span>"); } }, 15000);

  async function api(body) {   // the session's own calls (status, stop) -- through the relay that started it
    const a = S.api || {};
    try {
      const r = a.kind === "operator"
        ? await fetch("/api/relay/rcx", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
        : await fetch(a.base + "/api/rcx", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + a.bearer }, body: JSON.stringify({ ...body, by: S.admin?.name }) });
      const d = await r.json().catch(() => ({}));
      return { ...d, http: r.status };
    } catch (e) { return { ok: false, error: String(e?.message || e) }; }
  }
  const mName = () => S?.machine?.nick || S?.machine?.hostname || S?.machine?.name || S?.machine?.node || "the machine";

  function begin(s) {
    S = s;
    document.title = mName() + " — remote session — KASTR";
    $("mName").textContent = mName();
    $("mMeta").textContent = [S.machine?.role, S.machine?.site ? "via " + S.machine.site : "", "session " + String(S.sid).slice(0, 8)].filter(Boolean).join(" · ");
    if (S.machine?.adminWindows === "limited") { const n = $("note"); n.textContent = "Minimize, move, resize and close need KASTR to run as administrator on " + mName() + "’s computer"; n.title = "Administrator windows: Windows keeps a normal process out of them"; n.hidden = false; }
    if (S.kind === "ask") { chip("Waiting for " + mName() + " to allow…", "wait"); msg("Asking " + esc(mName()) + "…<span class='sub'>" + esc(mName()) + " gets a prompt to allow it and picks the screen (up to " + (Number(S.wait) || 60) + " s). Their screen opens here privately — nobody else sees it.</span>"); }   // 0.21.92: an admin's ask
    else msg("Connecting to " + esc(mName()) + "…<span class='sub'>Control is already granted — " + esc(mName()) + " shows a red bar with your name while you are connected.</span>");
    const url = withJwt(S.relay, S.token);
    conn = connect(url);
    prod = producer(conn, S.paths.admin, ["in.json", "ctl.json"], { priority: 255, maxAge: 2000 });
    const w = $("w");
    w.setAttribute("name", S.paths.screen);
    c.wurl = url; c.rs = 1;
    w.setAttribute("url", playerUrl());

               ptr: subscribe(conn, S.paths.machine, "ptr.json", ptrArrive, { priority: 255, staleMs: 8000 }),
               src: subscribe(conn, S.paths.machine, "src.json", srcArrive, { priority: 250, staleMs: 30000 }) };

    emit({ t: "hb" });

    c.stT = setInterval(statusPoll, 3000);

  }

  // ---- what the machine says
  function stArrive(v) {
    if (!v || v.rcid !== S.rcid || c.ended) return;
    c.stAt = Date.now();
    if (v.active === false) { ended(v.ended || "stopped"); return; }
    c.st = v;
    if (!c.live || $("chip").textContent !== "Controlling") { c.live = true; chip("Controlling", "live"); }
    if (v.url && v.url !== c.url) { c.url = v.url; paintSrc(); }
    if (v.ack && Number(v.ack.s) > c.ackS) {
      c.ackS = Number(v.ack.s);
      const at = c.sent.get(c.ackS);
      if (at) {
        const rtt = Date.now() - at, sh = Math.max(0, (Number(v.ack.inj) || 0) - (Number(v.ack.rx) || 0)), one = Math.max(0, (rtt - sh) / 2) + sh;
        const L = c.lat;
        c.lat = L ? { rtt: Math.round(L.rtt * 0.8 + rtt * 0.2), oneWay: Math.round(L.oneWay * 0.8 + one * 0.2), last: rtt, n: L.n + 1 } : { rtt, oneWay: Math.round(one), last: rtt, n: 1 };
        $("lat").textContent = "input " + c.lat.oneWay + " ms";
      }
    }
    if (v.clip && Number(v.clip.n) > c.clipN && typeof v.clip.text === "string") {   // the machine's clipboard changed during the session

      try { navigator.clipboard?.writeText?.(v.clip.text)?.catch?.(() => { c.clipPend = v.clip.text; }); } catch { c.clipPend = v.clip.text; }

    const bt = { elevated: "That window runs as administrator on " + mName() + " — Windows keeps KASTR's input out of it (minimize, move, resize and close need KASTR to run as administrator on " + mName() + "’s computer)",
                 secure: mName() + " shows a secure screen (sign-in or an administrator prompt) — KASTR can't control it",
                 focus: "Click inside the window first — keys go to the window in front", hidden: "The window is minimized on " + mName(),
                 drag: "Someone at " + mName() + " is dragging with their own mouse — your click goes as soon as they let go" }[b];
    el.textContent = bt || ""; el.hidden = !bt;
  }
  const ptrEls = new Map();
  function ptrArrive(v) {
    if (!v || v.rcid !== S.rcid) return;
    if (v.end) { for (const el of ptrEls.values()) el.hidden = true; return; }

  function paintPtrs() {

      if (!el) {
        el = document.createElement("div"); el.className = "rptr";
        el.innerHTML = '<svg viewBox="0 0 20 20"><path d="M2 1 17 11l-6.4 1 3.5 6.6-2.6 1.3-3.4-6.6L2 18z" fill="#fff" stroke="#000" stroke-width="1"/></svg><i></i>';
        box.appendChild(el); ptrEls.set(p.k, el);
      }

      const show = !!p.on && !!pt;
      el.hidden = !show;

    if (!v || v.rcid !== S.rcid) return;

    if (v.thumbs) c.thumbs = v.thumbs;
    if (v.url && v.url !== c.url) c.url = v.url;
    const last = v.last;
    if (last && c.sw && last.n === c.sw.n && last.op === "src" && last.state !== "switching" && !c.sw.ack) {

  // ---- the session's life
  async function statusPoll() {

                stopped: "it was stopped on the machine", timeout: "the connection went quiet for 10 s", share: "the capture stopped on the machine", noanswer: "the machine did not answer",
                lost: "the machine went quiet", limit: "the 8-hour limit", off: "the machine's owner switched unattended control off", busy: "someone else controls that machine",

      chip(c.ended === "denied" ? "Declined" : c.ended === "noanswer" ? "No answer" : "Not started", "end");

        + "<span class='sub'>The request was logged on their computer and on the hub.</span><button type='button' id='closeWin'>Close window</button>");
    } else
    msg("The session with " + esc(mName()) + " ended — " + esc(WHY[c.ended] || text || c.ended) + ".<span class='sub'>Everything was logged on the machine and on the hub.</span><button type='button' id='closeWin'>Close window</button>");

    if (c.ended) return;

    if (fr > 0 && !c.firstFrameAt) { c.firstFrameAt = Date.now(); msg(null); $("cap").focus({ preventScroll: true }); }
    if (!fr && c.live && !c.firstFrameAt) msg("Waiting for " + esc(mName()) + "'s picture…<span class='sub'>Control is granted; the capture is starting.</span>");
    swTick(fr);
    if ($("cap") === document.activeElement && document.hasFocus()) {   // my clipboard changed: theirs follows (text, up to 64 KB)
      if (c.clipPend) { const p0 = c.clipPend; c.clipPend = null; navigator.clipboard?.writeText?.(p0)?.catch?.(() => {}); }
      navigator.clipboard?.readText?.().then((tx) => {
        if (c.ended || typeof tx !== "string" || !tx || tx === c.clipLast) return;
        c.clipLast = tx;
        if (new Blob([tx]).size <= CLIP_MAX) emit({ t: "clip", text: tx });
      }, () => {});
    }
    if ($("srcPop").hidden === false && Date.now() - (c.thumbAsk || 0) > 20000) { c.thumbAsk = Date.now(); ctl({ op: "thumbs" }); }
    paintPtrs();
  }
  function frames() {
    try { const st = $("w").video?.out?.stats?.peek?.(); return Number(st?.frameCount || st?.frames || 0) || ($("cv").width > 0 && c.firstFrameAt ? 1 : 0); } catch { return 0; }
  }

  // ---- the input (the 0.21.80 controller's in.json: the last KEEP_MS of events, sequence-numbered)
  function emit(ev) {
    if (!S || c.ended || !prod) return;
    if (c.hold && ev.t !== "hb") { c.hold.push(ev); return; }
    const now = Date.now();
    if (ev.t !== "hb") { ev.s = ++c.seq; ev.a = now; c.buf.push(ev); c.sent.set(ev.s, now); if (c.sent.size > 400) c.sent.delete(c.sent.keys().next().value); }
    c.buf = c.buf.filter((e) => now - e.a <= KEEP_MS);
    while (c.buf.length > KEEP_N) { const i = c.buf.findIndex((e) => e.t === "m"); c.buf.splice(i >= 0 ? i : 0, 1); }
    prod.set("in.json", { rcid: S.rcid, seq: c.seq, t: now, ev: c.buf });
    c.sentAt = now;
  }
  function ctl(body) { if (!prod || c.ended) return 0; const n = ++c.ctlN; prod.set("ctl.json", { rcid: S.rcid, n, t: Date.now(), ...body }); return n; }
  function flushMove() { if (c.mvT) { clearTimeout(c.mvT); c.mvT = 0; } if (c.mv) { const m = c.mv; c.mv = null; c.mvAt = performance.now(); emit({ t: "m", x: m.x, y: m.y }); } }
  function geom() {
    const el = $("cv"), cw = el.width, ch = el.height, Bw = el.clientWidth, Bh = el.clientHeight;
    if (!cw || !ch || !Bw || !Bh) return null;
    const sc = Math.min(Bw / cw, Bh / ch);
    return { r: el.getBoundingClientRect(), cw, ch, Bw, Bh, sc, ox: (Bw - cw * sc) / 2, oy: (Bh - ch * sc) / 2 };
  }
  function toPic(cx, cy) {
    const g = geom(); if (!g) return null;
    const lx = (cx - g.r.left) * g.Bw / g.r.width, ly = (cy - g.r.top) * g.Bh / g.r.height;
    return { x: Math.round((lx - g.ox) / (g.cw * g.sc) * 1e5) / 1e5, y: Math.round((ly - g.oy) / (g.ch * g.sc) * 1e5) / 1e5 };
  }
  function toClient(x, y) {
    const g = geom(); if (!g || !(x >= 0 && x <= 1 && y >= 0 && y <= 1)) return null;
    const box = $("stage").getBoundingClientRect();
    return [g.r.left - box.left + (g.ox + x * g.cw * g.sc) * g.r.width / g.Bw, g.r.top - box.top + (g.oy + y * g.ch * g.sc) * g.r.height / g.Bh];
  }
  const inPic = (p) => !!p && p.x >= 0 && p.x <= 1 && p.y >= 0 && p.y <= 1;
  function capAttach() {
    const cap = $("cap");
    const stopE = (e) => e.stopPropagation();
    for (const k of ["click", "dblclick", "auxclick"]) cap.addEventListener(k, stopE);
    cap.addEventListener("contextmenu", (e) => { e.preventDefault(); });
    cap.addEventListener("mousemove", (e) => {
      const p = toPic(e.clientX, e.clientY);
      if (!p || c.ended) return;
      c.mv = p;
      if (!c.mvT) { const w = 16 - (performance.now() - c.mvAt); if (w <= 0) flushMove(); else c.mvT = setTimeout(() => { c.mvT = 0; flushMove(); }, w); }
    });
    cap.addEventListener("mouseleave", () => { if (c.ended) return; flushMove(); emit({ t: "m", o: 1 }); });
    cap.addEventListener("mousedown", (e) => {
      e.preventDefault();
      cap.focus({ preventScroll: true });
      $("srcPop").hidden = true;
      const p = toPic(e.clientX, e.clientY);
      if (!inPic(p) || e.button > 4) return;
      flushMove(); c.btn.add(e.button);
      emit({ t: "d", b: e.button, x: p.x, y: p.y });
    });
    window.addEventListener("mouseup", (e) => {
      if (!c.btn.has(e.button) || c.ended) return;
      e.preventDefault();
      const p = toPic(e.clientX, e.clientY) || { x: 0.5, y: 0.5 };
      c.btn.delete(e.button); flushMove();
      emit({ t: "u", b: e.button, x: Math.min(1, Math.max(0, p.x)), y: Math.min(1, Math.max(0, p.y)) });
    }, true);
    cap.addEventListener("wheel", (e) => {
      e.preventDefault();
      const p = toPic(e.clientX, e.clientY);
      if (!inPic(p)) return;
      const k = e.deltaMode === 1 ? 1 / 3 : e.deltaMode === 2 ? 1 : 1 / 100;
      c.wv += e.deltaY * k; c.wh += e.deltaX * k;
      const n = Math.trunc(c.wv), h = Math.trunc(c.wh);
      if (!n && !h) return;
      c.wv -= n; c.wh -= h; flushMove();
      emit({ t: "w", n, h, x: p.x, y: p.y });
    }, { passive: false });
    cap.addEventListener("blur", letGo);
  }
  function letGo() {
    for (const code of [...c.down]) emit({ t: "k", c: code, d: 0 });
    c.down.clear(); clearTimeout(c.escT);
  }
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.altKey && (e.code === "PageUp" || e.code === "PageDown")) { e.preventDefault(); stepMon(e.code === "PageDown" ? 1 : -1); return; }   // never sent to the machine
    if (!S || c.ended || document.activeElement !== $("cap")) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (e.code === "Escape" && !e.repeat) { clearTimeout(c.escT); c.escT = setTimeout(() => stop("released"), 1000); }
    if (e.repeat || !e.code || c.down.has(e.code)) return;
    if (e.code === "KeyV" && (e.ctrlKey || e.metaKey) && navigator.clipboard?.readText && !c.hold) {   // paste: my clipboard first, then the keys
      c.hold = [];
      const done = (tx) => { if (!c.hold) return; const q = c.hold; c.hold = null;
        if (typeof tx === "string" && tx && tx !== c.clipLast && new Blob([tx]).size <= CLIP_MAX) { c.clipLast = tx; emit({ t: "clip", text: tx }); }
        for (const ev of q) emit(ev); };
      navigator.clipboard.readText().then(done, () => done(null));
      setTimeout(() => done(null), 1000);
    }
    c.down.add(e.code); flushMove();
    emit({ t: "k", c: e.code, d: 1 });
  }, true);
  window.addEventListener("keyup", (e) => {
    if (!S || c.ended || document.activeElement !== $("cap")) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (e.code === "Escape") clearTimeout(c.escT);
    if (!c.down.has(e.code)) return;
    c.down.delete(e.code);
    emit({ t: "k", c: e.code, d: 0 });
  }, true);
  window.addEventListener("resize", paintPtrs);

  // ---- the source switcher (Kenton: "allow for switching to different windows/monitors on the device")
  const monIdx = (u) => { const m = /^screen:\/\/monitor\/([0-9]+)$/.exec(String(u || "")); return m ? Number(m[1]) : null; };
  const winId = (u) => { const m = /^screen:\/\/window\/([0-9]+)$/.exec(String(u || "")); return m ? m[1] : null; };
  function srcLabel(u) {
    const L = c.src || {}, mi = monIdx(u);
    if (mi === 99) return "All monitors";
    if (mi != null) { const m = (L.monitors || []).find((x) => x.index === mi); return m ? m.name : "Screen " + (mi + 1); }
    const w = (L.windows || []).find((x) => x.url === u);
    return w ? (w.title || w.app || "Window") : "Window";
  }
  function paintSrc() {
    const L = c.src;
    const mons = (L?.monitors || []).map((m) => m.index);
    $("srcBtn").disabled = !L || c.ended;
    $("srcBtn").textContent = srcLabel(c.url) + " ▾";
    const many = mons.length > 1;
    $("prevMon").disabled = $("nextMon").disabled = !many || c.ended;
    $("frontBtn").hidden = !winId(c.url);
    if (!$("srcPop").hidden) paintPop();
  }
  function paintPop() {
    const L = c.src, pop = $("srcPop"), th = c.thumbs || {};
    if (!L) { pop.innerHTML = "<div class='hint'>Asking " + esc(mName()) + " for its monitors and windows…</div>"; return; }
    const item = (url, id, title, sub, icon) => "<button type='button' class='it" + (url === c.url ? " on" : "") + "' data-url='" + esc(url) + "'>"
      + "<span class='th' style=\"" + (th[id] ? "background-image:url(" + th[id] + ")" : "") + "\">" + (th[id] ? "" : icon) + "</span>"
      + "<span class='t' title='" + esc(title) + "'>" + esc(title) + "</span><span class='a'>" + esc(sub) + "</span></button>";
    let h = "<h4>Monitors</h4><div class='grid'>";
    for (const m of L.monitors || []) h += item(m.url, m.id, m.name, (m.width && m.height ? m.width + "×" + m.height : "") + (m.primary ? " · main" : ""), "▭");
    if (L.all) h += item("screen://monitor/99", "", "All monitors", (L.monitors || []).length + " screens side by side", "▭▭");
    h += "</div><h4>Windows</h4>";
    if (!(L.windows || []).length) h += "<div class='hint'>No windows open.</div>";
    else { h += "<div class='grid'>"; for (const w of L.windows) h += item(w.url, w.id, w.title || w.app || "Window", (w.app || "") + (w.minimized ? " · minimized" : ""), "▢"); h += "</div>"; }
    h += "<div class='hint'>A window share follows the window. Picking a minimized window restores it on " + esc(mName()) + ".</div>";
    pop.innerHTML = h;
    for (const b of pop.querySelectorAll(".it")) b.addEventListener("click", () => { pop.hidden = true; pick(b.dataset.url); });
  }
  $("srcBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    const pop = $("srcPop");
    pop.hidden = !pop.hidden;
    if (!pop.hidden) { c.thumbAsk = Date.now(); ctl({ op: "thumbs" }); paintPop(); }
  });
  document.addEventListener("click", (e) => { if (!$("srcPop").contains(e.target)) $("srcPop").hidden = true; });
  $("prevMon").addEventListener("click", () => stepMon(-1));
  $("nextMon").addEventListener("click", () => stepMon(1));
  $("frontBtn").addEventListener("click", () => { if (winId(c.url)) c.front = ctl({ op: "front", url: c.url }); });
  function stepMon(dir) {
    const mons = (c.src?.monitors || []).map((m) => m.index);
    if (mons.length < 2 || c.ended) return;
    const cur = monIdx(c.url);
    const i = mons.indexOf(cur);
    const next = i < 0 ? mons[dir > 0 ? 0 : mons.length - 1] : mons[(i + dir + mons.length) % mons.length];
    pick("screen://monitor/" + next);
  }
  function pick(url) {
    if (!S || c.ended || !url || url === c.url || c.sw) return;
    c.sw = { n: ctl({ op: "src", url }), url, at: Date.now(), ack: 0, frames0: 0, resub: 0 };
    $("swText").textContent = "Switching to " + srcLabel(url) + "…";
    $("sw").hidden = false;
  }
  // The switch restarts the capture under the same path (Bridge.retarget; the old pair now ends ffmpeg-first and leaves the
  // relay at once -- Publisher.quiet -- so this player picks the new broadcast up by itself: lab v02183, 0.6-1.6 s). Only when no
  // new frames come within SW_SELF_MS (or SW_RESUB_MS after a machine that waited for its new capture's output, `live`) does the
  // player re-subscribe on a fresh session, again every SW_RETRY_MS; "Switching…" covers the picture until the new capture's
  // frames play -- never a frozen picture. Before Publisher.quiet a player left on the killed broadcast waited 4-20 s.
  // SW_SELF_MS: an answer that did not wait for the new capture (live null) -- the player usually finds the new broadcast by itself
  const SW_RESUB_MS = 100, SW_RESUB_LATE_MS = 800, SW_SELF_MS = 1200, SW_RETRY_MS = 1500;
  // the player dials its OWN session (`rs`, ignored by the relay): a re-subscribe is a fresh session, and the JSON tracks'
  // session (st / ptr / src / in / ctl) is never touched by it
  function playerUrl() { return c.wurl + "&rs=" + c.rs; }
  function resub() {
    const w = $("w");
    c.rs++;
    w.removeAttribute("url");
    setTimeout(() => { if (!c.ended) w.setAttribute("url", playerUrl()); }, 40);
  }
  function swTick(fr) {
    const s = c.sw;
    if (!s) return;
    const now = Date.now();
    if (s.ack && fr > s.frames0 + 1 && now - (s.resub || s.ack) > 120) { swDone(true); return; }
    if (s.ack && s.resubAt && now >= s.resubAt && (!s.resub || (now - s.resub > SW_RETRY_MS && fr <= s.frames0 + 1 && s.tries < 8))) {
      s.resub = now; s.tries = (s.tries || 0) + 1; s.frames0 = frames(); resub();
    }
    if (now - s.at > 20000) { swDone(false); toast("The switch took too long — try again.", true); }
  }
  function swDone(ok) {
    const s = c.sw; if (!s) return;
    c.sw = null;
    $("sw").hidden = true;
    const rec = { url: s.url, ok, ackMs: s.ack ? s.ack - s.at : null, serverMs: s.serverMs || 0, pictureMs: ok ? Date.now() - s.at : null, resubs: s.tries || 0, live: s.live ?? null };
    c.switches.push(rec); if (c.switches.length > 20) c.switches.shift();
    if (ok) { c.url = s.url; paintSrc(); }
  }
</script>
</body>
</html>
